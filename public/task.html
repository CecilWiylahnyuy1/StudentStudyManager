<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — Student Study Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html">Home</a>
    <a href="task.html">Tasks</a>
    <a href="notes.html">Notes</a>
    <a href="timetable.html">Timetable</a>
    <a href="#" id="logout-link">Log Out</a>
  </nav>

  <h1>Tasks</h1>
    <p id="streak-display">🔥 Streak: 0 days</p>
  <section>
    <form id="task-form">
      <input type="text" id="task-title" placeholder="Task title" required>
      <input type="text" id="task-subject" placeholder="Subject" required>
      <input type="date" id="task-dueDate" required>
      <button type="submit">Add Task</button>
    </form>
    <ul id="task-list"></ul>
  </section>
<div id="streak-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="mascot">
      <div class="mascot-face">
        <div class="mascot-eye left"></div>
        <div class="mascot-eye right"></div>
        <div class="mascot-mouth"></div>
      </div>
    </div>
    <h2>Quiz passed!</h2>
    <p class="modal-subtitle">You answered every question correctly.</p>
    <div class="streak-card">
      <p class="streak-label">Current streak</p>
      <p class="streak-number">🔥 <span id="modal-streak-count">0</span> days</p>
    </div>
    <button id="modal-continue-btn">Continue</button>
  </div>
</div>

<footer class="site-footer">
  <p>Student Study Manager &copy; 2026. Built to help students stay organized and consistent.</p>
  <p>Created by S. Cecil | <a href="https://github.com/CecilWiylahnyuy1" target="_blank">GitHub</a></p>
</footer>


<script src="script.js"></script>
</body>
</html>
